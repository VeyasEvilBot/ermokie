version: "2"

linters:
  disable:
    - dupl
    - gocyclo
  enable:
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilnil
    - noctx
    - prealloc
    - staticcheck

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - wrapperFunc
    errcheck:
      check-type-assertions: true
      check-blank: false
  exclusions:
    generated: strict
    presets: []
    rules:
      - text: "Error return value of `.*Close` is not checked"
        linters:
          - errcheck
      - text: "Error return value of `.*Fprintf.*` is not checked"
        linters:
          - errcheck

issues:
  # Preserve the inherited Codeberg tree as the lint baseline while enforcing
  # the tethux rules on all work added in this continuation repository.
  new-from-rev: cafd3b6c657e60e6bcc85ddcefddd87c4deb80d8
