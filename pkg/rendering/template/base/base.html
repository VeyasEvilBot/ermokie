<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{.CssName}}">
    <title>Ermokie</title>
</head>

<body>
    <div class="run-name">{{.RunName}}</div>
    <table>
        <thead>
            <tr>
                <th>Splits</th>
                <th>Hits</th>
                <th>PB</th>
                <th>Diff</th>
            </tr>
        </thead>
        <tbody>
            {{range .Splits}}
            <tr {{if .IsActive}}class="highlighted" {{end}}>
                <td>{{.SplitName}}</td>
                <td>{{.Hits}}</td>
                <td>{{.PB}}</td>
                <td>{{.Diff}}</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</body>
<script>
    // OBS Browser Source keeps this page open; reload to pick up an atomic
    // render update without mutating the document and losing event handlers.
    window.setTimeout(() => window.location.reload(), 1000);
</script>

</html>
